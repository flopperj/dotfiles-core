name: lint
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats + shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: make all
        run: make all
