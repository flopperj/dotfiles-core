name: lint
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # jq is ambient on ubuntu-latest, but the eval runner and several tests
      # depend on it — install it explicitly rather than riding the default.
      - name: install bats + shellcheck + jq
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq
      - name: lint
        run: make lint
      - name: consult grammar
        run: make check-consult-grammar
      - name: tests (leakage mechanism runs on synthetic tokens)
        run: make test
      # Classifier answer-key eval under the mechanical ratchet: warn-only
      # below 30 cases, blocking at >= 30, derived from the set file's own
      # record count — no human toggle. The runner prints the arm taken and
      # the case count that decided it, so a non-blocking run is explicable
      # from this step's log alone. CI has no model access, so this is the
      # deterministic self-check (set integrity + runner self-consistency);
      # prediction-scoring runs against real classifier output are local.
      - name: eval (ratchet prints arm + case count)
        run: make eval
      # Secret-free shape scan — always runs on public runners and fork PRs.
      # Catches in-tree denylist files and corporate email shapes without the
      # real company token list.
      - name: leakage shape scan
        run: make check-leakage-shapes
      # The company token data exists only in trusted environments. On public
      # runners the scan below is structurally skipped — a visible "skipped"
      # step status, never a silent green.
      - name: detect guard data
        id: guard
        run: |
          if [ -f "${XDG_CONFIG_HOME:-$HOME/.config}/dotfiles-guard/company-context" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: company-token scan
        if: steps.guard.outputs.present == 'true'
        run: make check-leakage
